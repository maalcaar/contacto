<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMERGENCY / ICE MEDICAL INFO</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #f4f6f8; 
            padding: 20px 15px; 
            margin: 0; 
            color: #222; 
        }
        .card { 
            background: white; 
            border-radius: 16px; 
            padding: 24px 20px; 
            box-shadow: 0 6px 18px rgba(0,0,0,0.08); 
            max-width: 420px; 
            margin: 0 auto; 
            border-top: 8px solid #dc3545; 
        }
        .header { 
            text-align: center; 
            margin-bottom: 24px; 
        }
        .header h1 { 
            color: #dc3545; 
            font-size: 20px; 
            margin: 0 0 6px 0; 
            letter-spacing: 0.5px; 
            text-transform: uppercase; 
        }
        .header p { 
            color: #6c757d; 
            font-size: 13px; 
            margin: 0; 
            font-weight: 500; 
        }
        .item { 
            margin-bottom: 16px; 
            padding-bottom: 12px; 
            border-bottom: 1px solid #edf2f7; 
        }
        .item:last-child { 
            border-bottom: none; 
            margin-bottom: 0; 
            padding-bottom: 0; 
        }
        .label { 
            font-weight: 700; 
            font-size: 12px; 
            color: #718096; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
        }
        .value { 
            font-size: 18px; 
            margin-top: 4px; 
            color: #1a202c; 
            font-weight: 600; 
        }
        .highlight { 
            color: #dc3545; 
            font-weight: 700; 
            font-size: 20px; 
        }
        .btn-call { 
            display: block; 
            background: #28a745; 
            color: white; 
            text-align: center; 
            padding: 14px; 
            border-radius: 10px; 
            text-decoration: none; 
            font-weight: 700; 
            font-size: 18px; 
            margin-top: 10px; 
            box-shadow: 0 4px 10px rgba(40,167,69,0.25); 
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>🚨 EMERGENCY MEDICAL INFO</h1>
            <p>In Case of Emergency (ICE)</p>
        </div>
        
        <div class="item">
            <div class="label">Full Name</div>
            <div class="value">Manuel Alejandro Carvajal Araya</div>
        </div>

        <div class="item">
            <div class="label">Blood Type</div>
            <div class="value highlight">A+ (Rh Positive)</div>
        </div>

        <div class="item">
            <div class="label">Emergency Contact</div>
            <div class="value">Wife (Pin)</div>
            <a href="tel:+4522459559" class="btn-call">📞 Call Pin (+45 22459559)</a>
        </div>

        <div class="item">
            <div class="label">Allergies</div>
            <div class="value">None</div>
        </div>

        <div class="item">
            <div class="label">Religion</div>
            <div class="value">None</div>
        </div>

        <div class="item">
            <div class="label">Organ Donor</div>
            <div class="value">No</div>
        </div>
    </div>
</body>
</html>
